<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem 120px 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #8a8a93;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        header a {
            color: #00ff88;
            text-decoration: none;
        }

        header a:hover {
            text-decoration: underline;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 3.5rem;
        }

        .sound-section {
            width: 100%;
        }

        #soundSections {
            display: contents;
        }

        .section-title {
            font-size: 1.6rem;
            color: #e1e1e6;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #2a2a32;
            padding-bottom: 0.5rem;
            text-align: center;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .sound-card {
            background: #1e1e24;
            border: 2px solid #2a2a32;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            user-select: none;
        }

        .sound-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.1);
        }

        .sound-card:active {
            transform: translateY(1px);
        }

        .sound-card.hidden {
            display: none !important;
        }

        .sound-section.hidden {
            display: none !important;
        }

        .sound-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #e1e1e6;
        }

        .play-icon {
            font-size: 1.5rem;
            color: #00ff88;
        }

        .sticky-search-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            width: 90%;
            max-width: 800px;
            background: rgba(30, 30, 36, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #2a2a32;
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s ease;
            backdrop-filter: blur(80px);
            /* -webkit-backdrop-filter: blur(16px); */
            background: rgba(30, 30, 36, 0.25);
        }

        .sticky-search-bar:focus-within {
            border-color: #00ff88;
        }

        .icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            flex-shrink: 0;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-icon {
            color: #ffffff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            min-width: 60px;
        }

        .search-input::placeholder {
            color: #8a8a93;
        }

        .shortcut-badge {
            background: #2a2a32;
            color: #8a8a93;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
        }

        .count-badge {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }

        .bar-divider {
            width: 1px;
            height: 24px;
            background: #2a2a32;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 70px;
            accent-color: #00ff88;
            cursor: pointer;
        }

        .boost-button {
            background: #2a2a32;
            border: 1px solid #4a4a55;
            color: #e1e1e6;
            border-radius: 16px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .boost-button:hover,
        .boost-button.active {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
            color: #ffc107;
        }

        .stop-button {
            background: #ff4757;
            border: none;
            color: #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.1s ease;
        }

        .stop-button svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            stroke: none;
        }

        .stop-button:active {
            transform: scale(0.96);
        }

        .no-results {
            display: none;
            text-align: center;
            color: #8a8a93;
            font-size: 1.2rem;
            padding: 3rem 1rem;
            width: 100%;
        }

        @media (max-width: 600px) {
            .count-badge {
                display: none;
            }

            .volume-slider {
                width: 50px;
            }

            .sticky-search-bar {
                width: 95%;
                padding: 6px 12px;
                gap: 8px;
                bottom: 12px;
            }
        }

        @media (max-width: 720px) {
            .shortcut-badge {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .volume-container {
                display: none;
            }
        }
    </style>
</head>

        const audioPlayer = new Audio();
        const amplifyGain = 10 ** (33 / 20);
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioContext;
        let sourceNode;
        let gainNode;
        let boosted = false;
        const soundSectionsContainer = document.getElementById('soundSections');
        const searchInput = document.getElementById('searchInput');
        const soundCounter = document.getElementById('soundCounter');
        const noResults = document.getElementById('noResults');
        const volumeControl = document.getElementById('volumeControl');
        const boostButton = document.getElementById('boostButton');

        function setupAudioGraph() {
            if (audioContext) {
                return;
            }

            if (!AudioContextClass) {
                return;
            }

            audioContext = new AudioContextClass();
            sourceNode = audioContext.createMediaElementSource(audioPlayer);
            gainNode = audioContext.createGain();
            sourceNode.connect(gainNode).connect(audioContext.destination);
            updateAudioEffects();
        }

        function updateAudioEffects() {
            if (gainNode) {
                gainNode.gain.value = Number.parseFloat(volumeControl.value) * (boosted ? amplifyGain : 1);
            }
        }

        function updateBoostButton() {
            boostButton.classList.toggle('active', boosted);
            boostButton.setAttribute('aria-pressed', String(boosted));
            boostButton.style.background = boosted ? 'rgba(255, 193, 7, 0.2)' : '';
            boostButton.style.borderColor = boosted ? '#ffc107' : '';
            boostButton.style.color = boosted ? '#ffc107' : '';
        }

        function renderSoundSections() {
            soundSectionsContainer.replaceChildren();

            soundCatalogBySection.forEach((sectionData) => {
                const section = document.createElement('section');
                section.className = 'sound-section';

                const heading = document.createElement('h2');
                heading.className = 'section-title';
                heading.textContent = sectionData.title;

                const grid = document.createElement('div');
                grid.className = 'dashboard-grid';

                sectionData.sounds.forEach((sound) => {
                    const card = document.createElement('div');
                    card.className = 'sound-card';
                    card.dataset.file = sound.file;
                    card.dataset.title = sound.title;

                    const title = document.createElement('div');
                    title.className = 'sound-title';
                    title.textContent = sound.title;

                    const playIcon = document.createElement('div');
                    playIcon.className = 'play-icon';
                    playIcon.textContent = '▶';

                    card.append(title, playIcon);
                    card.addEventListener('click', () => playSound(sound.file));
                    grid.append(card);
                });

                section.append(heading, grid);
                soundSectionsContainer.append(section);
            });
        }

        async function playSound(soundName) {
            setupAudioGraph();
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            audioPlayer.src = `sounds/${soundName}.mp3`;
            audioPlayer.currentTime = 0;
            await audioPlayer.play();
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        volumeControl.addEventListener('input', () => {
            updateAudioEffects();
        });

        boostButton.addEventListener('click', () => {
            boosted = !boosted;
            updateBoostButton();
            updateAudioEffects();
        });

        function filterCards() {
            const query = searchInput.value.toLowerCase().trim();
            const sections = soundSectionsContainer.querySelectorAll('.sound-section');
            let totalVisibleSounds = 0;

            sections.forEach((section) => {
                const cards = section.querySelectorAll('.sound-card');
                let visibleInSection = 0;

                cards.forEach((card) => {
                    if (card.dataset.title.toLowerCase().includes(query)) {
                        card.classList.remove('hidden');
                        visibleInSection++;
                        totalVisibleSounds++;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                section.classList.toggle('hidden', visibleInSection === 0);
            });

            soundCounter.textContent = `${totalVisibleSounds} ${totalVisibleSounds === 1 ? 'suono' : 'suoni'}`;
            noResults.style.display = totalVisibleSounds === 0 ? 'block' : 'none';
        }

        renderSoundSections();
        searchInput.addEventListener('input', filterCards);
        filterCards();

        window.addEventListener('keydown', (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                searchInput.focus();
            }
        });
